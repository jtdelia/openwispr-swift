name: Bug report
description: Something is broken or behaves differently than expected.
title: "bug: "
labels: ["type:bug", "needs-triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem in a sentence or two. Include error messages verbatim.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version or commit, OS, runtime, browser, or anything else that might matter.
    validations:
      required: false
