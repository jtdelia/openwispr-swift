name: OpenCode

# Comment "/oc <request>" (or "/opencode <request>") on an issue, a pull request, or a
# line of a pull request diff. Only the repository owner, members, and collaborators can
# trigger it. Examples: "/oc explain this issue", "/oc fix the failing test".
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  opencode:
    if: >-
      (startsWith(github.event.comment.body, '/oc') || contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/opencode') || contains(github.event.comment.body, ' /opencode')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: model
        uses: ./.github/actions/pick-free-model

      - name: Report that no model is available
        if: steps.model.outputs.primary == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh issue comment "$NUMBER" --body "No free OpenCode model is available right now, so this request was not run. Try again later."
          exit 1

      - name: Run with the best free model
        id: primary
        continue-on-error: true
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        with:
          model: ${{ steps.model.outputs.primary }}
          share: false

      - name: Retry with the next free model
        if: steps.primary.outcome == 'failure' && steps.model.outputs.fallback != ''
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        with:
          model: ${{ steps.model.outputs.fallback }}
          share: false

      - name: Fail if no model succeeded
        if: steps.primary.outcome == 'failure' && steps.model.outputs.fallback == ''
        run: exit 1
