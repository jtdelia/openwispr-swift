included:
  - App
  - Packages/OpenWisprCore/Sources
  - Packages/OpenWisprCore/Tests
  - Packages/OpenWisprEngines/Sources
excluded:
  - "**/.build"
  - build

disabled_rules:
  - trailing_comma
  - nesting
  - large_tuple
  - todo
  - optional_data_string_conversion

identifier_name:
  min_length: 1
  max_length: 60
line_length:
  warning: 200
  error: 250
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
file_length:
  warning: 1000
  error: 1400
type_body_length:
  warning: 600
  error: 900
function_body_length:
  warning: 80
  error: 120
cyclomatic_complexity:
  warning: 20
  error: 30
